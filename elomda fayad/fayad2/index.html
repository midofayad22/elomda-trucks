<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العمدة فؤاد - قطع غيار نقل ثقيل</title>
    <!-- استدعاء مكتبة تصميم سريعة اسمها Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- الهيدر / رأس الصفحة -->
    <header class="bg-blue-900 text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-bold">العمدة فؤاد لتجارة الشاحنات وقطع الغيار</h1>
        <p class="text-sm mt-2 text-gray-300">استيراد مباشر من ألمانيا - أجود قطع الغيار والشاسيهات</p>
    </header>

    <!-- الأقسام / Categories -->
    <div class="container mx-auto my-8 p-4">
        <h2 class="text-2xl font-bold mb-4 text-gray-700 border-r-4 border-blue-900 pr-2">أقسام قطع الغيار</h2>
        
        <div class="flex wrap gap-3 mb-6">
            <button class="bg-blue-900 text-white px-4 py-2 rounded-lg hover:bg-blue-800">الكل</button>
            <button class="bg-white border px-4 py-2 rounded-lg hover:bg-gray-50">ماكن (محركات)</button>
            <button class="bg-white border px-4 py-2 rounded-lg hover:bg-gray-50">عفش وسوست</button>
            <button class="bg-white border px-4 py-2 rounded-lg hover:bg-gray-50">كرونة (Diff)</button>
            <button class="bg-white border px-4 py-2 rounded-lg hover:bg-gray-50">شاسيهات ومقطورات</button>
        </div>

        <!-- شبكة عرض المنتجات (Products Grid) -->
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <!-- قسم موقعنا على الخريطة (Google Maps Embed) -->
    <section class="container mx-auto my-8 p-4 bg-white rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4 text-gray-700">موقعنا على الخريطة</h2>
        <div class="w-full h-64 rounded-lg overflow-hidden border">
            <!-- خريطة مجانية عن طريق iframe -->
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3453.8!2d31.2!3d30.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDAwJzAwLjAiTiAzM8KwMTInMDAuMCJF!5e0!3m2!1sar!2seg!4v1600000000000!5m2!1sar!2seg" 
                width="100%" 
                height="100%" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
    </section>

</body>
</html>
